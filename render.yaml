# Render Blueprint Specification (render.yaml)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: evacuation-route-analyzer
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONUNBUFFERED
        value: "1"
