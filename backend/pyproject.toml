[project]
name = "evac-analyzer-backend"
version = "0.1.0"
description = "Emergency Evacuation Route Analyzer - Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "scikit-image>=0.22.0",
    "scipy>=1.12.0",
    "pillow>=10.2.0",
    "pymupdf>=1.24.0",
    "networkx>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "hypothesis>=6.98.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
